<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
</head>
<body>
<h2>Create Account</h2>

<form method="POST">

    {{ form.hidden_tag() }}

    <div>
        {{ form.username.label }}
        {{ form.username() }}
    </div>

    <br>

    <div>
        {{ form.email.label }}
        {{ form.email() }}
    </div>

    <br>

    <div>
        {{ form.password.label }}
        {{ form.password() }}
    </div>

    <br>

    <div>
        {{ form.submit() }}
    </div>

</form>
</body>
</html>
